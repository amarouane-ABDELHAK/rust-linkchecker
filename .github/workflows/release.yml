name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the musl target
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          rustup target add x86_64-unknown-linux-musl

      - name: Test
        run: cargo test --locked

      # Statically linked: the binary is downloaded onto whatever runner image
      # the consuming workflow happens to use, and must not depend on its glibc.
      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          binary=target/x86_64-unknown-linux-musl/release/linkchecker
          cp "$binary" linkchecker-x86_64-unknown-linux-musl
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            linkchecker-x86_64-unknown-linux-musl
